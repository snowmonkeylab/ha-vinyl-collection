search:
  name: Search Collection
  description: Search your collection by artist, album, label, genre, or catalog number. Returns matching records.
  fields:
    query:
      name: Query
      required: false
      example: "Pink Floyd"
      selector:
        text:

lookup_discogs:
  name: Lookup Discogs
  description: Search Discogs for a release. Returns up to 8 matching results with metadata and cover art.
  fields:
    query:
      name: Query
      required: true
      example: "Pink Floyd Dark Side of the Moon"
      selector:
        text:

get_discogs_tracks:
  name: Get Discogs Tracks
  description: Fetch the tracklist for a Discogs release or master by ID.
  fields:
    discogs_id:
      name: Discogs ID
      required: true
      selector:
        text:
    resource_type:
      name: Resource Type
      required: false
      description: "master or release (default: release)"
      selector:
        select:
          options:
            - "master"
            - "release"

get_config:
  name: Get Config
  description: Returns integration configuration state, including whether Discogs is enabled and a token is set. No outbound calls made.

import_discogs_collection:
  name: Import Discogs Collection
  description: >-
    Import your existing Discogs collection (folder "All") as records,
    skipping any already in your collection by Discogs ID. Non-vinyl-only
    releases (CD, cassette, digital, etc. with no vinyl format) are skipped.
    Requires Discogs to be enabled with a valid token.
