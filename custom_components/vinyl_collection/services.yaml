add_record:
  name: Add Record
  description: Add a vinyl record to your collection.
  fields:
    artist:
      name: Artist
      required: true
      example: "Pink Floyd"
      selector:
        text:
    album:
      name: Album
      required: true
      example: "The Dark Side of the Moon"
      selector:
        text:
    year:
      name: Year
      required: false
      example: 1973
      selector:
        number:
          min: 1900
          max: 2100
          mode: box
    genre:
      name: Genre
      required: false
      selector:
        text:
    label:
      name: Label
      required: false
      selector:
        text:
    catalog_number:
      name: Catalog Number
      required: false
      selector:
        text:
    rating:
      name: Rating
      required: false
      selector:
        number:
          min: 1
          max: 5
          mode: box
    owned_by:
      name: Owned By
      required: false
      description: List of HA Person entity IDs who own this record.
      selector:
        object:
    discogs_id:
      name: Discogs ID
      required: false
      selector:
        text:
    discogs_resource_type:
      name: Discogs Resource Type
      required: false
      description: "release or master - needed to look up tracks for this discogs_id later."
      selector:
        select:
          options:
            - "release"
            - "master"
    cover_url:
      name: Cover Art URL
      required: false
      selector:
        text:
    spotify_uri:
      name: Spotify URI
      required: false
      selector:
        text:
    is_wishlist:
      name: Wish List
      required: false
      selector:
        boolean:
    is_next_buy:
      name: Next Buy
      required: false
      selector:
        boolean:
    tracks:
      name: Tracks
      required: false
      description: Cached tracklist (position, title, duration) for this record.
      selector:
        object:

